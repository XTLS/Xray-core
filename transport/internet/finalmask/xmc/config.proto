syntax = "proto3";

package xray.transport.internet.finalmask.xmc;
option csharp_namespace = "Xray.Transport.Internet.Finalmask.XMC";
option go_package = "github.com/xtls/xray-core/transport/internet/finalmask/xmc";
option java_package = "com.xray.transport.internet.finalmask.xmc";
option java_multiple_files = true;

message Profile {
    // Resolve the UUID from https://api.mojang.com/users/profiles/minecraft/{username}.
    string username = 1;
    bytes uuid = 2;
    // Copy the signed textures property returned by
    // https://sessionserver.mojang.com/session/minecraft/profile/{uuid}?unsigned=false.
    string textures_value = 3;
    string textures_signature = 4;
}

message Config {
    string password = 1;
    reserved 2;
    bytes rsa_private_key = 8;
    bytes rsa_public_key = 9;
    string hostname = 10;
    repeated Profile profiles = 11;
    // Startup padding turns. Empty uses the built-in preset, unless
    // no_padding is set.
    repeated Padding paddings = 12;
    // Disables startup padding. The configuration sets this for an explicit
    // empty "paddings" array, which an unset repeated field cannot express.
    bool no_padding = 14;
}

message Padding {
    int64 length_min = 1;
    int64 length_max = 2;
    // 1 = client to server, 2 = server to client
    int32 direction = 3;
    // Millisecond pause after this turn, including the last one. The side that
    // sends the turn waits for a uniformly selected value in
    // [delay_min, delay_max]; the peer only knows delay_min and waits that
    // long before its next own turn, so a range jitters the wire timing from
    // the sender's side. Zero means no delay.
    int64 delay_min = 4;
    int64 delay_max = 5;
}
