syntax = "proto3";

package xray.transport.internet.finalmask.xmc;
option csharp_namespace = "Xray.Transport.Internet.Finalmask.XMC";
option go_package = "github.com/xtls/xray-core/transport/internet/finalmask/xmc";
option java_package = "com.xray.transport.internet.finalmask.xmc";
option java_multiple_files = true;

message Profile {
    // Resolve the UUID from https://api.mojang.com/users/profiles/minecraft/{username}.
    string username = 1;
    bytes uuid = 2;
    // Copy the signed textures property returned by
    // https://sessionserver.mojang.com/session/minecraft/profile/{uuid}?unsigned=false.
    string textures_value = 3;
    string textures_signature = 4;
}

message Yggdrasil {
    // API root of a third-party Yggdrasil API server, for example
    // https://skin.example.com/api/yggdrasil. The client logs in to this API
    // and the server verifies players through
    // sessionserver/session/minecraft/hasJoined.
    string api = 1;
    // Account used by the client to authenticate with the API. Usually an
    // email address, depending on the API implementation.
    string username = 2;
    string password = 3;
    // Optional player name. Required when the account owns several players.
    string player = 4;
}

message Config {
    // Seeds the derived RSA key pair shared by both sides. In legacy mode it
    // is also the pre-shared password checked during login.
    string password = 1;
    reserved 2;
    bytes rsa_private_key = 8;
    bytes rsa_public_key = 9;
    string hostname = 10;
    repeated Profile profiles = 11;
    // Startup padding turns. Empty uses the built-in preset.
    repeated Padding paddings = 12;
    // Optional third-party Yggdrasil login. Field 13 keeps configurations
    // that already set 12 for paddings working unchanged.
    Yggdrasil yggdrasil = 13;
}

message Padding {
    int64 length_min = 1;
    int64 length_max = 2;
    // 1 = client to server, 2 = server to client
    int32 direction = 3;
    // Millisecond pause after this turn, including the last one. The sender
    // waits for a uniformly selected value in [delay_min, delay_max]; the
    // receiver waits at least delay_min. Zero means no delay.
    int64 delay_min = 4;
    int64 delay_max = 5;
}
