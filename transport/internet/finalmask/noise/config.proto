syntax = "proto3";

package xray.transport.internet.finalmask.noise;
option csharp_namespace = "Xray.Transport.Internet.Finalmask.Noise";
option go_package = "github.com/xtls/xray-core/transport/internet/finalmask/noise";
option java_package = "com.xray.transport.internet.finalmask.noise";
option java_multiple_files = true;

message Segment {
    enum Kind {
        BYTES = 0;
        RANDOM = 1;
        RANDOM_ASCII = 2;
        RANDOM_DIGIT = 3;
        TIMESTAMP = 4;
        COUNTER = 5;
        NONCE = 6;
    }
    Kind kind = 1;
    bytes bytes = 2;
    int64 min_size = 3;
    int64 max_size = 4;
}

message Item {
    int64 rand_min = 1;
    int64 rand_max = 2;
    int32 rand_range_min = 3;
    int32 rand_range_max = 4;
    bytes packet = 5;
    int64 delay_min = 6;
    int64 delay_max = 7;
    repeated Segment segments = 8;
}

message Config {
    int64 reset_min = 1;
    int64 reset_max = 2;
    repeated Item items = 3;
}
